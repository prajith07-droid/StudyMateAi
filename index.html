<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StudyMate AI</title>
<style>
:root{--bg:#0b1020;--card:#141b34;--card2:#1b2445;--tx:#eaf0ff;--mut:#93a0c8;--ac:#7c6cff;--ac2:#4ea8ff;--ok:#3ddc97;--warn:#ffb84d;--bad:#ff6b7a;--bd:#263056;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f6ff;--card:#fff;--card2:#eef1ff;--tx:#141a33;--mut:#5b668c;--bd:#dde3f7}}
:root[data-theme="light"]{--bg:#f3f6ff;--card:#fff;--card2:#eef1ff;--tx:#141a33;--mut:#5b668c;--bd:#dde3f7}
:root[data-theme="dark"]{--bg:#0b1020;--card:#141b34;--card2:#1b2445;--tx:#eaf0ff;--mut:#93a0c8;--bd:#263056}
*{box-sizing:border-box}html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100%}
nav{background:var(--card);border-right:1px solid var(--bd);padding:16px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.logo{font-weight:800;font-size:18px;padding:6px 10px 14px;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
nav button{all:unset;cursor:pointer;padding:11px 12px;border-radius:12px;color:var(--mut);display:flex;gap:10px;transition:.2s}
nav button:hover,nav button:focus-visible{background:var(--card2);color:var(--tx)}
nav button.on{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff}
main{padding:24px;max-width:1000px;width:100%;margin:0 auto;overflow-x:hidden}
h1{font-size:26px;margin:0 0 4px}h2{font-size:19px;margin:22px 0 10px}h3{margin:0 0 6px;font-size:16px}
.mut{color:var(--mut)}.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;box-shadow:0 6px 20px rgba(0,0,0,.12);transition:.2s}
.card.h:hover{transform:translateY(-3px);border-color:var(--ac)}
.btn{cursor:pointer;border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:600;color:#fff;background:linear-gradient(90deg,var(--ac),var(--ac2));min-height:42px;transition:.15s}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}.btn.g{background:var(--card2);color:var(--tx);border:1px solid var(--bd)}
.btn.r{background:var(--bad)}.btn.s{padding:6px 10px;min-height:32px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
input,select,textarea{width:100%;background:var(--card2);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px;font:inherit}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.bar{height:9px;background:var(--card2);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:9px;transition:width .8s}
.tag{font-size:12px;padding:2px 9px;border-radius:99px;background:var(--card2);border:1px solid var(--bd)}
.big{font-size:34px;font-weight:800}.hero{padding:40px 24px;text-align:center;border-radius:24px;background:linear-gradient(135deg,#1c2350,#5b3fd6 70%,#3b82f6);color:#fff}
.hero h1{font-size:40px;letter-spacing:1px}.tabs{display:flex;gap:6px;overflow-x:auto;margin:12px 0}.tabs button{white-space:nowrap}
.blk{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd);align-items:center}.blk b{min-width:118px;font-variant-numeric:tabular-nums}
.warn{background:rgba(255,184,77,.12);border:1px solid var(--warn);border-radius:12px;padding:10px;margin:8px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal>div{background:var(--card);border-radius:20px;padding:20px;max-width:460px;width:100%;max-height:90%;overflow:auto;border:1px solid var(--bd)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ok);color:#062;padding:10px 18px;border-radius:99px;font-weight:700;opacity:0;transition:.3s;z-index:99;pointer-events:none}#toast.on{opacity:1}
.chat{height:340px;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:8px}.m{padding:9px 13px;border-radius:14px;max-width:80%}.m.u{align-self:flex-end;background:var(--ac);color:#fff}.m.b{background:var(--card2)}
.breath{width:150px;height:150px;border-radius:50%;margin:20px auto;background:radial-gradient(var(--ac2),var(--ac));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;transition:transform 4s ease-in-out}
.mem{display:grid;grid-template-columns:repeat(4,64px);gap:8px;justify-content:center}.mem button{height:64px;font-size:28px;border-radius:12px;border:1px solid var(--bd);background:var(--card2);cursor:pointer}
#focus{position:fixed;inset:0;background:#070a18;color:#fff;z-index:80;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}#focus .t{font-size:84px;font-weight:800;font-variant-numeric:tabular-nums}
@media(max-width:760px){.app{display:block}nav{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;z-index:40;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--bd);justify-content:space-around}
nav button{flex-direction:column;align-items:center;font-size:10px;gap:0;padding:6px}.logo{display:none}main{padding:16px 14px 100px}.hero h1{font-size:30px}.blk{flex-wrap:wrap}}
</style>
</head>
<body>
<div class="app"><nav id="nav" aria-label="Main navigation"></nav><main id="main"></main></div>
<div id="focus"></div><div id="toast" role="status"></div>
<script>
// ---------- Storage (localStorage, guarded) ----------
const AK='sm_accounts',SK='sm_session',DK=u=>'sm_data_'+u;
const fresh=()=>({student:null,plans:[],active:null,xp:0,streak:0,last:null,moods:[],mins:0,pref:'06:00',hours:3,theme:'',view:'home',tab:'overview',all:true,ts:0});
const rd=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const wr=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}};
let ACC=rd(AK,{}),USER=rd(SK,null),S=fresh(),CLOUD=null,CT=null,AM='in';
if(USER&&ACC[USER])S=Object.assign(fresh(),rd(DK(USER),{}));else USER=null;
const save=()=>{if(!USER)return;S.ts=Date.now();wr(DK(USER),S);cloudPush()};
// ---------- Helpers ----------
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P=()=>S.plans.find(p=>p.id===S.active&&!p.archived),live=()=>S.plans.filter(p=>!p.archived);
const dl=p=>Math.ceil((new Date(p.exam+'T09:00')-Date.now())/864e5);
const chs=p=>p.subjects.flatMap(s=>s.chapters.map(c=>({c,subj:s.name,weak:s.weak})));
const pct=p=>{const a=chs(p);return a.length?Math.round(a.filter(x=>x.c.status==='done').length/a.length*100):0};
const sp=(p,n)=>{const a=chs(p).filter(x=>x.c.status!=='done');return a.length?Math.round(a.length):0};
const D={Easy:1,Medium:2,Hard:3},I={Low:1,Medium:2,High:3};
function pend(p){const d=Math.max(dl(p),2);return chs(p).filter(x=>x.c.status!=='done').map(x=>({...x,sc:D[x.c.diff]*I[x.c.imp]*(x.weak?1.5:1)*(x.c.status==='doing'?1.2:1)*(14/d+1)})).sort((a,b)=>b.sc-a.sc)}
const tm=s=>{const[a,b]=s.split(':').map(Number);return a*60+b},ft=m=>{m=(m+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
const t12=s=>{let[h,m]=s.split(':').map(Number);return(h%12||12)+':'+String(m).padStart(2,'0')+(h<12?' AM':' PM')};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200)}
function modal(html){const m=document.createElement('div');m.className='modal';m.innerHTML='<div role="dialog" aria-modal="true">'+html+'</div>';m.onclick=e=>{if(e.target===m)m.remove()};document.body.appendChild(m);return m}
function form(title,fields,cb){const m=modal('<h3>'+title+'</h3>'+fields.map(f=>'<label>'+f.l+'</label>'+(f.o?'<select name="'+f.k+'">'+f.o.map(o=>'<option '+(o===f.v?'selected':'')+'>'+o+'</option>').join('')+'</select>':f.t==='area'?'<textarea rows="5" name="'+f.k+'">'+esc(f.v||'')+'</textarea>':'<input name="'+f.k+'" type="'+(f.t||'text')+'" value="'+esc(f.v||'')+'">')).join('')+'<div class="row" style="margin-top:14px"><button class="btn" id="ok">Save</button><button class="btn g" id="no">Cancel</button></div>');
m.querySelector('#no').onclick=()=>m.remove();m.querySelector('#ok').onclick=()=>{const v={};m.querySelectorAll('[name]').forEach(e=>v[e.name]=e.value);m.remove();cb(v)}}
function confirmBox(t,cb){const m=modal('<p>'+t+'</p><div class="row"><button class="btn r" id="y">Yes</button><button class="btn g" id="n">Cancel</button></div>');m.querySelector('#n').onclick=()=>m.remove();m.querySelector('#y').onclick=()=>{m.remove();cb()}}
const lvl=()=>Math.floor(S.xp/100)+1,ttl=()=>['Beginner','Curious Learner','Focused Student','Deep Thinker','Exam Warrior','Scholar','Master'][Math.min(6,Math.floor(lvl()/2))];
function award(n,msg){S.xp+=n;const t=new Date().toDateString();if(S.last!==t){const y=new Date(Date.now()-864e5).toDateString();S.streak=S.last===y?S.streak+1:1;S.last=t}save();toast((msg||'✅ Done!')+' +'+n+' XP')}
// ---------- Planner (rule-based "AI"; FUTURE AI API INTEGRATION: replace gen()/answer() with a server-side LLM call) ----------
const ACT=['Concept learning','Problem practice','Formula + examples','Mini test','Mistake analysis'];
function gen(p,mins,start){const list=pend(p),out=[];let t=tm(start||S.pref),left=mins,i=0,off=new Date().getDate();
while(left>=20&&list.length){const x=list[i%list.length],len=Math.min(45,left);out.push({id:uid(),s:ft(t),e:ft(t+len),subj:x.subj,ch:x.c.name,act:ACT[(off+i)%ACT.length],pr:x.sc>12?'High':x.sc>6?'Medium':'Low'});t+=len;left-=len;i++;
if(left>=25){out.push({id:uid(),s:ft(t),e:ft(t+10),subj:'Break',ch:'Stretch, water, breathe',act:'Break',pr:'Low'});t+=10;left-=10}}
if(left>=5&&out.length)out.push({id:uid(),s:ft(t),e:ft(t+5),subj:'Quick Recall',ch:'Recall key points from today',act:'Recall',pr:'Low'});return out}
function conflicts(b){const a=[...b].sort((x,y)=>tm(x.s)-tm(y.s)),r=[];for(let i=1;i<a.length;i++)if(tm(a[i].s)<tm(a[i-1].e))r.push([a[i-1],a[i]]);return r}
function fix(b){const a=[...b].sort((x,y)=>tm(x.s)-tm(y.s));for(let i=1;i<a.length;i++){const pe=tm(a[i-1].e);if(tm(a[i].s)<pe){const d=tm(a[i].e)-tm(a[i].s);a[i].s=ft(pe);a[i].e=ft(pe+d)}}return a}
function addRevs(p,c,subj){[[1,'Quick revision'],[3,'Practice'],[7,'Revision'],[14,'Mini test']].forEach(([d,l])=>p.revisions.push({id:uid(),label:l+' — '+subj+': '+c.name,due:new Date(Date.now()+d*864e5).toISOString().slice(0,10),done:false}))}
const PRE={'Fast Revision':'Skim summaries, formulas and past mistakes daily.','Deep Learning':'Learn concepts fully before practice; longer sessions.','Last-Minute':'Only high-importance chapters, short recall cycles.','Weak Chapter Recovery':'Spend 60% of time on weak subjects and hard chapters.','Practice-Heavy':'70% problem solving, 30% concept review.','Balanced':'Mix learn, practice, revise and test every week.'};
// ---------- Demo data ----------
function mk(name,icon,days,pr,subj,frac){const p={id:uid(),name,icon,exam:new Date(Date.now()+days*864e5).toISOString().slice(0,10),priority:pr,archived:false,subjects:[],schedules:[],strategies:[],revisions:[],notes:[],goals:[]};
const df=['Medium','Hard','Easy'],im=['High','Medium','Low'];let n=0;Object.entries(subj).forEach(([s,cl],si)=>p.subjects.push({name:s,weak:si===1,chapters:cl.map((c,i)=>({id:uid(),name:c,diff:df[(i+si)%3],imp:im[(i*2+si)%3],status:'todo'}))}));
const all=p.subjects.flatMap(s=>s.chapters),k=Math.round(all.length*frac);all.forEach((c,i)=>{if(i<k){c.status='done'}else if(i===k)c.status='doing'});
p.subjects.forEach(s=>s.chapters.filter(c=>c.status==='done').slice(-1).forEach(c=>addRevs(p,c,s.name)));
p.strategies.push({id:uid(),name:'Balanced',obj:PRE.Balanced,hours:3,active:true});
p.schedules.push({id:uid(),name:'Regular School Day',active:true,blocks:gen(p,180,'17:00')});
p.notes.push({id:uid(),subj:Object.keys(subj)[0],title:'Important formulas',text:'Add key formulas and doubts here.'});return p}
function demo(){S=Object.assign(fresh(),{student:{name:'Alex',cls:'Grade 12',org:'Riverside High',dept:'Science'},streak:5,xp:420,last:new Date().toDateString(),mins:340,moods:[{d:Date.now()-864e5*3,m:'🙂'},{d:Date.now()-864e5*2,m:'😟'},{d:Date.now()-864e5,m:'😊'}]});
S.plans=[mk('Mathematics Unit Test','📐',12,'high',{Mathematics:['Trigonometry','Algebra','Calculus Basics','Vectors','Matrices','Probability','Statistics','Geometry'],Practice:['Mock Papers']},.64),
mk('Physics Model Exam','🔬',18,'medium',{Physics:['Electrostatics','Current Electricity','Magnetism','Optics','Modern Physics','Waves','Thermodynamics']},.5),
mk('Chemistry Semester Exam','🧪',24,'low',{Organic:['Hydrocarbons','Alcohols','Amines','Polymers','Biomolecules'],Inorganic:['Periodic Table','d-block','Coordination','Metallurgy','p-block']},.8),
mk('UCEED Preparation','🎨',160,'medium',{Design:['Sketching','Visualization','Design Theory','Logical Reasoning','Observation','Mock Tests']},.31)];S.active=S.plans[0].id;save();go('home');toast('🎉 Demo student loaded')}
// ---------- Accounts (login persists across reloads; optional private cloud sync) ----------
async function hash(u,pw,salt){const t=salt+':'+u+':'+pw;try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of t)h=((h<<5)+h+c.charCodeAt(0))|0;return'x'+h}}
async function signup(u,pw){u=u.trim().toLowerCase();if(!/^[a-z0-9_]{3,20}$/.test(u))return toast('Username: 3–20 letters, numbers or _');if(pw.length<4)return toast('Password needs 4+ characters');if(ACC[u])return toast('That username is taken');const salt=uid();ACC[u]={salt,h:await hash(u,pw,salt)};wr(AK,ACC);const old=rd('studymate_ai_v1',null);S=Object.assign(fresh(),Object.keys(ACC).length===1&&old?old:{});S.view='home';USER=u;wr(SK,u);save();toast('🎉 Account created — you are signed in');render()}
async function login(u,pw){u=u.trim().toLowerCase();const a=ACC[u];if(!a||await hash(u,pw,a.salt)!==a.h)return toast('Wrong username or password');USER=u;wr(SK,u);S=Object.assign(fresh(),rd(DK(u),{}));S.view='home';toast('Welcome back!');render()}
function logout(){USER=null;try{localStorage.removeItem(SK)}catch(e){}S=fresh();render()}
function authGo(){const u=$('#au').value,p=$('#ap').value;AM==='up'?signup(u,p):login(u,p)}
function authView(){return`<div class="hero" style="margin-bottom:16px"><h1>STUDYMATE AI</h1><p style="font-size:18px;margin:4px 0">Your syllabus. Your exams. Your plan.</p></div><div class="card" style="max-width:420px;margin:0 auto"><div class="row" style="margin-bottom:8px"><button class="btn s ${AM==='in'?'':'g'}" onclick="AM='in';render()">Sign in</button><button class="btn s ${AM==='up'?'':'g'}" onclick="AM='up';render()">Create account</button></div><label for="au">Username</label><input id="au" autocomplete="username" autocapitalize="none" onkeydown="if(event.key==='Enter')authGo()"><label for="ap">Password</label><input id="ap" type="password" autocomplete="${AM==='up'?'new-password':'current-password'}" onkeydown="if(event.key==='Enter')authGo()"><button class="btn" style="width:100%;margin-top:14px" onclick="authGo()">${AM==='up'?'Create my account':'Sign in'}</button><p class="mut" style="font-size:13px">Your plans are saved automatically and are still here after you reload or close and reopen the page. Passwords are stored only as a salted hash.</p></div>`}
function cloudPush(){if(!CLOUD)return;clearTimeout(CT);CT=setTimeout(()=>{const data={};Object.keys(ACC).forEach(u=>{const d=rd(DK(u),null);if(d)data[u]=d});CLOUD.set({acc:JSON.stringify(ACC),data:JSON.stringify(data),ts:Date.now()}).catch(()=>{})},1500)}
async function cloudInit(){try{if(!window.claude)return;const[db,us]=await Promise.all([claude.use('db'),claude.use('user')]);if(!db||!us)return;const id=await us.id();if(!id)return;CLOUD=db.doc('data/users/'+id+'/state');const snap=await CLOUD.get();let ch=false;if(snap.exists){const b=snap.data(),ca=JSON.parse(b.acc||'{}'),cd=JSON.parse(b.data||'{}');Object.keys(ca).forEach(u=>{if(!ACC[u]){ACC[u]=ca[u];ch=true}});Object.keys(cd).forEach(u=>{const l=rd(DK(u),null);if(!l||(cd[u].ts||0)>(l.ts||0)){wr(DK(u),cd[u]);if(u===USER)ch=true}});wr(AK,ACC);if(ch){if(USER){const v=S.view,t=S.tab;S=Object.assign(fresh(),rd(DK(USER),{}));S.view=v;S.tab=t}render()}}cloudPush()}catch(e){}}
// ---------- Navigation & rendering ----------
const NAV=[['home','🏠','Home'],['plans','📚','Plans'],['schedule','📅','Schedule'],['progress','📊','Progress'],['break','🧘','Break'],['chill','🤖','ChillBot'],['settings','⚙️','Settings']];
function go(v,tab){S.view=v;if(tab)S.tab=tab;save();render();scrollTo(0,0)}
function render(){document.documentElement.dataset.theme=S.theme||'';document.querySelector('.app').style.display=USER?'':'block';if(!USER){$('#nav').style.display='none';$('#main').innerHTML=authView();return}$('#nav').style.display='';
$('#nav').innerHTML='<div class="logo">STUDYMATE AI</div>'+NAV.map(n=>'<button class="'+((S.view===n[0]||(n[0]==='plans'&&S.view==='plan'))?'on':'')+'" onclick="'+(n[0]==='schedule'?'openSched()':'go(\''+n[0]+'\')')+'"><span>'+n[1]+'</span>'+n[2]+'</button>').join('');
const v={home:S.student?dash:landing,plans,plan:planView,progress,break:brk,chill,settings}[S.view]||landing;$('#main').innerHTML=v();if(S.view==='break')initBreak();if(S.view==='chill')initChill();tick()}
function openSched(){if(P())go('plan','schedule');else{toast('Open or create a plan first');go('plans')}}
function tick(){document.querySelectorAll('[data-x]').forEach(e=>{const ms=new Date(e.dataset.x+'T09:00')-Date.now();if(ms<0){e.textContent='Exam day!';return}const d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),m=Math.floor(ms%36e5/6e4);e.textContent=d+' DAYS  '+String(h).padStart(2,'0')+' HRS  '+String(m).padStart(2,'0')+' MIN'})}
setInterval(tick,30000);
function landing(){return`<div class="hero"><h1>STUDYMATE AI</h1><p style="font-size:20px;margin:6px 0">Your syllabus. Your exams. Your plan.</p><p style="max-width:560px;margin:8px auto 20px;opacity:.9">A smart study companion that turns your syllabus, exam dates, available time and priorities into a realistic study strategy. Plan smarter. Study better. Stress less.</p>
<div class="row" style="justify-content:center"><button class="btn" style="background:#fff;color:#4a35c8" onclick="setup()">Create My Study Plan</button><button class="btn g" onclick="go('break')">Explore Brain Break</button><button class="btn g" onclick="demo()">Load Demo Student</button></div></div>
<h2 style="text-align:center">PLAN → STUDY → TRACK → ADAPT → RELAX</h2><div class="grid">${[['📚','Smart Study Planner','Personalized schedules from your priorities.'],['🤖','AI Study Strategy','Realistic strategy based on workload.'],['📅','Exam Countdown','Live countdown for every exam.'],['📊','Progress Tracker','Chapters, revisions, XP and streaks.'],['🧘','Brain Break','Healthy short breaks and a 60s reset.'],['🎮','Mini Games','Quick 1–5 minute games.'],['🤖','ChillBot','Supportive stress-relief chat.']].map(f=>`<div class="card h"><h3>${f[0]} ${f[1]}</h3><span class="mut">${f[2]}</span></div>`).join('')}</div>`}
function setup(){form('👋 Create your study plan',[{k:'name',l:'Your name'},{k:'cls',l:'Class / Year'},{k:'org',l:'School / College'},{k:'pn',l:'Plan name (e.g. Physics Unit Test)',v:'My Exam'},{k:'ex',l:'Exam date',t:'date'},{k:'sub',l:'Subject',v:'Physics'},{k:'chp',l:'Chapters (one per line — pasted syllabus works)',t:'area'}],v=>{
if(!v.ex){return toast('Please choose an exam date')}S.student={name:v.name||'Student',cls:v.cls,org:v.org};
const p={id:uid(),name:v.pn||'My Exam',icon:'🎓',exam:v.ex,priority:'medium',archived:false,subjects:[{name:v.sub||'Subject',weak:false,chapters:v.chp.split('\n').map(x=>x.trim()).filter(Boolean).map(n=>({id:uid(),name:n,diff:'Medium',imp:'Medium',status:'todo'}))}],schedules:[],strategies:[{id:uid(),name:'Balanced',obj:PRE.Balanced,hours:S.hours,active:true}],revisions:[],notes:[],goals:[]};
p.schedules.push({id:uid(),name:'Regular Day',active:true,blocks:gen(p,S.hours*60)});S.plans.push(p);S.active=p.id;save();toast('📅 Study plan generated!');go('plan','overview')})}
function dash(){const ps=S.all?live():[P()].filter(Boolean);const nx=[...live()].sort((a,b)=>dl(a)-dl(b))[0];const h=new Date().getHours();
const today=ps.flatMap(p=>pend(p).slice(0,2).map(x=>({p,x}))).sort((a,b)=>b.x.sc-a.x.sc).slice(0,5);
return`<h1>Good ${h<12?'morning':h<18?'afternoon':'evening'}, ${esc(S.student.name)} 👋</h1><p class="mut">Currently active: ${P()?esc(P().icon+' '+P().name):'none'}</p>
<div class="row"><button class="btn g s" onclick="S.all=true;save();render()">All plans</button><button class="btn g s" onclick="S.all=false;save();render()">Active plan only</button><button class="btn r s" onclick="behind()">🚨 I'M BEHIND</button><button class="btn s" onclick="focus()">⏱ Focus Mode</button></div>
${nx?`<div class="card" style="margin-top:14px"><span class="mut">NEXT EXAM</span><h3>${esc(nx.icon+' '+nx.name)}</h3><div class="big" data-x="${nx.exam}"></div></div>`:''}
<h2>What should I study today?</h2><div class="card">${today.map(t=>`<div class="blk"><span>${esc(t.p.icon)}</span><div style="flex:1"><b>${esc(t.x.c.name)}</b><br><span class="mut">${esc(t.p.name)} · ${esc(t.x.subj)}</span></div><span class="tag">${t.x.c.diff}</span><button class="btn s" onclick="done('${t.p.id}','${t.x.c.id}')">✓ Done</button></div>`).join('')||'<span class="mut">Nothing pending — enjoy a break! 🎉</span>'}</div>
<h2>Upcoming exams</h2><div class="grid">${[...ps].sort((a,b)=>({high:0,medium:1,low:2}[a.priority]-{high:0,medium:1,low:2}[b.priority])||dl(a)-dl(b)).map(planCard).join('')}</div>
<h2>Stats</h2><div class="grid"><div class="card">🔥 <span class="big">${S.streak}</span> day streak</div><div class="card">⭐ <span class="big">${S.xp}</span> XP<br><span class="mut">Level ${lvl()} · ${ttl()}</span></div><div class="card">⏱ <span class="big">${S.mins}</span> min focused</div></div>
<h2>How are you feeling?</h2><div class="row">${['😊','🙂','😐','😟','😴','😵'].map(m=>`<button class="btn g" onclick="mood('${m}')">${m}</button>`).join('')}</div>`}
function mood(m){S.moods.push({d:Date.now(),m});save();toast('Mood saved privately on this device '+m);if(m==='😟'||m==='😵')setTimeout(()=>go('chill'),600)}
function done(pid,cid){const p=S.plans.find(x=>x.id===pid);p.subjects.forEach(s=>s.chapters.forEach(c=>{if(c.id===cid&&c.status!=='done'){c.status='done';addRevs(p,c,s.name);award(30,'✅ Chapter marked as completed!')}}));save();render()}
const pri={high:'🔴',medium:'🟡',low:'🟢'};
function planCard(p){return`<div class="card h"><h3>${esc(p.icon)} ${esc(p.name)} ${pri[p.priority]}</h3><span class="mut">Exam: ${esc(p.exam)} · ${chs(p).length} chapters</span><div class="bar" style="margin:10px 0"><i style="width:${pct(p)}%"></i></div><div class="row sp"><span>Progress: ${pct(p)}%</span><b>${Math.max(dl(p),0)} DAYS LEFT</b></div><div class="row" style="margin-top:10px"><button class="btn s" onclick="openPlan('${p.id}')">Open Plan</button></div></div>`}
function openPlan(id){S.active=id;S.tab='overview';go('plan')}
function plans(){const arc=S.plans.filter(p=>p.archived);return`<div class="row sp"><h1>My Study Plans</h1><button class="btn" onclick="newPlan()">+ Create New Study Plan</button></div><div class="grid">${live().map(p=>planCard(p)).join('')||'<p class="mut">No plans yet. Create one or load the demo from Settings.</p>'}</div>
${arc.length?'<h2>📦 Archived Plans</h2><div class="grid">'+arc.map(p=>`<div class="card"><h3>${esc(p.name)}</h3><div class="row"><button class="btn s" onclick="arch('${p.id}',false)">Restore</button><button class="btn r s" onclick="delPlan('${p.id}')">Delete forever</button></div></div>`).join('')+'</div>':''}
${S.student?'':'<p><button class="btn" onclick="setup()">Start with setup</button> <button class="btn g" onclick="demo()">Load Demo</button></p>'}`}
function newPlan(){form('New study plan',[{k:'n',l:'Plan name'},{k:'i',l:'Icon (emoji)',v:'📘'},{k:'e',l:'Exam date',t:'date'},{k:'p',l:'Priority',o:['high','medium','low'],v:'medium'}],v=>{if(!v.n||!v.e)return toast('Name and date needed');if(!S.student)S.student={name:'Student'};const p={id:uid(),name:v.n,icon:v.i||'📘',exam:v.e,priority:v.p,archived:false,subjects:[],schedules:[],strategies:[],revisions:[],notes:[],goals:[]};S.plans.push(p);S.active=p.id;save();toast('📅 Plan created');go('plan','syllabus')})}
function arch(id,a){S.plans.find(p=>p.id===id).archived=a;if(a&&S.active===id)S.active=(live()[0]||{}).id;save();render()}
function delPlan(id){confirmBox('Permanently delete this plan? This cannot be undone.',()=>{S.plans=S.plans.filter(p=>p.id!==id);if(S.active===id)S.active=(live()[0]||{}).id;save();go('plans')})}
function dup(){const p=JSON.parse(JSON.stringify(P()));p.id=uid();p.name+=' (copy)';p.revisions=[];p.notes=[];p.subjects.forEach(s=>s.chapters.forEach(c=>{c.id=uid();c.status='todo'}));p.schedules.forEach(s=>{s.id=uid();s.blocks.forEach(b=>b.id=uid())});S.plans.push(p);S.active=p.id;save();toast('Plan duplicated — edit the exam date');go('plan','settings')}
function dl2(name,obj){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(obj,null,1)],{type:'application/json'}));a.download=name;a.click()}
// ---------- Plan workspace ----------
const TABS=[['overview','Overview'],['schedule','📅 Schedule'],['syllabus','📚 Syllabus'],['strategy','🧠 Strategy'],['revision','🔄 Revision'],['notes','📝 Notes'],['assistant','🤖 AI Assistant'],['settings','⚙️ Plan Settings']];
function planView(){const p=P();if(!p){return'<p>No active plan.</p><button class="btn" onclick="go(\'plans\')">My Plans</button>'}
return`<div class="row sp"><div><span class="mut">Currently Active</span><h1>${esc(p.icon+' '+p.name)}</h1></div><select style="width:auto" aria-label="Switch plan" onchange="S.active=this.value;save();render()">${live().map(x=>`<option value="${x.id}" ${x.id===p.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>
<div class="big" data-x="${p.exam}" style="font-size:22px"></div><div class="tabs">${TABS.map(t=>`<button class="btn s ${S.tab===t[0]?'':'g'}" onclick="S.tab='${t[0]}';save();render()">${t[1]}</button>`).join('')}</div>${({overview:ov,schedule:sched,syllabus:syl,strategy:strat,revision:rev,notes,assistant:asst,settings:pset}[S.tab]||ov)(p)}`}
function ov(p){const n=pend(p);return`<div class="grid"><div class="card">Progress<div class="big">${pct(p)}%</div><div class="bar"><i style="width:${pct(p)}%"></i></div></div><div class="card">Chapters left<div class="big">${n.length}</div></div><div class="card">Days left<div class="big">${Math.max(dl(p),0)}</div></div></div>
<h2>Next up</h2><div class="card">${n.slice(0,4).map(x=>`<div class="blk"><b>${esc(x.c.name)}</b><span class="mut" style="flex:1">${esc(x.subj)}</span><span class="tag">${x.c.diff}/${x.c.imp}</span></div>`).join('')||'All chapters complete 🎉'}</div>
<div class="row" style="margin-top:12px"><button class="btn" onclick="S.tab='schedule';render()">Generate today's plan</button><button class="btn r" onclick="behind()">🚨 I'm behind</button><button class="btn g" onclick="focus()">⏱ Focus</button></div>`}
let TMP=null;
function sched(p){const mins=[30,60,120,180];return`<div class="card"><h3>How much time do you have today?</h3><div class="row">${mins.map(m=>`<button class="btn g" onclick="preview(${m})">${m<60?m+' min':m/60+' hour'+(m>60?'s':'')}</button>`).join('')}<button class="btn g" onclick="form('Custom minutes',[{k:'m',l:'Minutes',t:'number',v:90}],v=>preview(+v.m||60))">Custom</button></div></div>
${TMP?`<div class="card" style="margin-top:12px;border-color:var(--ac)"><h3>New schedule generated</h3>${blocks(TMP,null)}<div class="row" style="margin-top:10px"><button class="btn" onclick="saveS(false)">Save as New Schedule</button><button class="btn g" onclick="saveS(true)">Replace Current Schedule</button><button class="btn r" onclick="TMP=null;render()">Discard</button></div></div>`:''}
<div class="row sp"><h2>Schedules</h2><button class="btn s" onclick="newSched()">+ Create Schedule</button></div>${p.schedules.map(s=>{const c=conflicts(s.blocks);return`<div class="card" style="margin-bottom:12px"><div class="row sp"><h3>📅 ${esc(s.name)} ${s.active?'<span class="tag">Active</span>':''}</h3><div class="row"><button class="btn g s" onclick="sAct('${s.id}')">Set Active</button><button class="btn g s" onclick="sDup('${s.id}')">Duplicate</button><button class="btn g s" onclick="addBlock('${s.id}')">+ Block</button><button class="btn r s" onclick="sDel('${s.id}')">Delete</button></div></div>${c.length?`<div class="warn">⚠️ Schedule Conflict: ${esc(c[0][0].subj)} (${t12(c[0][0].s)}–${t12(c[0][0].e)}) overlaps ${esc(c[0][1].subj)}. <button class="btn s" onclick="sFix('${s.id}')">Fix Automatically</button></div>`:''}${blocks(s.blocks,s.id)}</div>`}).join('')||'<p class="mut">No schedules yet.</p>'}`}
function blocks(b,sid){return b.map((x,i)=>`<div class="blk"><b>${t12(x.s)}–${t12(x.e)}</b><div style="flex:1"><b style="min-width:0">${esc(x.subj)}</b> — ${esc(x.ch)}<br><span class="mut">${esc(x.act)}</span></div><span class="tag">${x.pr}</span>${sid?`<button class="btn g s" aria-label="Move up" onclick="mv('${sid}',${i},-1)">↑</button><button class="btn g s" aria-label="Move down" onclick="mv('${sid}',${i},1)">↓</button><button class="btn r s" aria-label="Delete block" onclick="bDel('${sid}',${i})">✕</button>`:''}</div>`).join('')}
const SC=id=>P().schedules.find(s=>s.id===id);
function preview(m){TMP=gen(P(),m);if(!TMP.length)toast('No pending chapters — add some in Syllabus');render()}
function saveS(rep){const p=P();if(rep){const a=p.schedules.find(s=>s.active)||p.schedules[0];if(a)a.blocks=TMP;else p.schedules.push({id:uid(),name:'Generated',active:true,blocks:TMP})}else{p.schedules.forEach(s=>s.active=false);p.schedules.push({id:uid(),name:'AI Schedule '+(p.schedules.length+1),active:true,blocks:TMP})}TMP=null;save();toast('📅 New schedule saved!');render()}
function newSched(){form('New schedule',[{k:'n',l:'Name'},{k:'t',l:'Type',o:['Regular School Day','College Day','Holiday Schedule','Evening Study','Intensive Revision','Emergency Revision','Light Study Day']}],v=>{P().schedules.push({id:uid(),name:v.n||v.t,active:false,blocks:[]});save();render()})}
function addBlock(id){const p=P(),sb=p.subjects.map(s=>s.name);form('Add time block',[{k:'s',l:'Start',t:'time',v:'17:00'},{k:'e',l:'End',t:'time',v:'17:45'},{k:'subj',l:'Subject',o:sb.length?sb:['General']},{k:'ch',l:'Chapter'},{k:'act',l:'Activity',o:ACT},{k:'pr',l:'Priority',o:['High','Medium','Low'],v:'Medium'}],v=>{if(tm(v.e)<=tm(v.s))return toast('End must be after start');SC(id).blocks.push({id:uid(),...v});save();render()})}
const sAct=id=>{P().schedules.forEach(s=>s.active=s.id===id);save();render()},sDel=id=>confirmBox('Delete this schedule?',()=>{P().schedules=P().schedules.filter(s=>s.id!==id);save();render()}),sDup=id=>{const s=JSON.parse(JSON.stringify(SC(id)));s.id=uid();s.name+=' (copy)';s.active=false;P().schedules.push(s);save();render()},sFix=id=>{SC(id).blocks=fix(SC(id).blocks);save();toast('Conflicts fixed');render()},bDel=(id,i)=>{SC(id).blocks.splice(i,1);save();render()},mv=(id,i,d)=>{const b=SC(id).blocks;if(b[i+d]){[b[i],b[i+d]]=[b[i+d],b[i]];save();render()}};
function syl(p){return`<div class="row"><button class="btn s" onclick="addSub()">+ Add Subject</button><button class="btn g s" onclick="upload()">📎 Upload Syllabus</button></div>`+p.subjects.map((s,si)=>{const a=s.chapters,d=a.filter(c=>c.status==='done').length,pc=a.length?Math.round(d/a.length*100):0;return`<details class="card" style="margin-top:12px" open><summary><b>${esc(s.name)}</b> ${s.weak?'<span class="tag">weak</span>':''} — ${pc}%</summary><div class="bar" style="margin:8px 0"><i style="width:${pc}%"></i></div>${a.map((c,ci)=>`<div class="blk"><div style="flex:1"><b style="min-width:0">${esc(c.name)}</b></div><select style="width:auto" aria-label="Status" onchange="setSt(${si},${ci},this.value)">${['todo','doing','done'].map(x=>`<option ${x===c.status?'selected':''}>${x}</option>`).join('')}</select><select style="width:auto" aria-label="Difficulty" onchange="P().subjects[${si}].chapters[${ci}].diff=this.value;save()">${Object.keys(D).map(x=>`<option ${x===c.diff?'selected':''}>${x}</option>`).join('')}</select><select style="width:auto" aria-label="Importance" onchange="P().subjects[${si}].chapters[${ci}].imp=this.value;save()">${Object.keys(I).map(x=>`<option ${x===c.imp?'selected':''}>${x}</option>`).join('')}</select><button class="btn r s" aria-label="Delete chapter" onclick="P().subjects[${si}].chapters.splice(${ci},1);save();render()">✕</button></div>`).join('')}<div class="row" style="margin-top:8px"><button class="btn s" onclick="addCh(${si})">+ Chapter</button><button class="btn g s" onclick="P().subjects[${si}].weak=!P().subjects[${si}].weak;save();render()">Toggle weak</button><button class="btn r s" onclick="confirmBox('Delete subject?',()=>{P().subjects.splice(${si},1);save();render()})">Delete subject</button></div></details>`}).join('')}
function setSt(si,ci,v){const s=P().subjects[si],c=s.chapters[ci],was=c.status;c.status=v;if(v==='done'&&was!=='done'){addRevs(P(),c,s.name);award(30,'✅ Chapter marked as completed!')}save();render()}
const addSub=()=>form('Add subject',[{k:'n',l:'Subject name'},{k:'w',l:'Strength',o:['Strong','Average','Weak'],v:'Average'}],v=>{if(v.n){P().subjects.push({name:v.n,weak:v.w==='Weak',chapters:[]});save();render()}});
const addCh=si=>form('Add chapter',[{k:'n',l:'Chapter'},{k:'d',l:'Difficulty',o:Object.keys(D),v:'Medium'},{k:'i',l:'Importance',o:Object.keys(I),v:'Medium'}],v=>{if(v.n){P().subjects[si].chapters.push({id:uid(),name:v.n,diff:v.d,imp:v.i,status:'todo'});save();render()}});
function upload(){const m=modal(`<h3>📎 Upload / paste syllabus</h3><p class="mut">Text files are imported here. PDF/image extraction needs an AI API (FUTURE AI API INTEGRATION) — paste the text instead.</p><input type="file" id="f" accept=".txt,.pdf,image/*"><label>Or paste chapters (one per line)</label><textarea id="t" rows="6"></textarea><label>Subject</label><select id="s">${P().subjects.map((s,i)=>`<option value="${i}">${esc(s.name)}</option>`).join('')}</select><div class="row" style="margin-top:12px"><button class="btn" id="ok">Import</button><button class="btn g" id="no">Cancel</button></div>`);
m.querySelector('#no').onclick=()=>m.remove();m.querySelector('#f').onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.type==='text/plain'||f.name.endsWith('.txt')){f.text().then(t=>m.querySelector('#t').value=t)}else toast('PDF/image parsing requires a future AI API — paste text instead')};
m.querySelector('#ok').onclick=()=>{const l=m.querySelector('#t').value.split('\n').map(x=>x.replace(/^\s*[\d.\-•)]+\s*/,'').trim()).filter(Boolean),s=P().subjects[m.querySelector('#s').value];if(!s){m.remove();return toast('Add a subject first')}l.forEach(n=>s.chapters.push({id:uid(),name:n,diff:'Medium',imp:'Medium',status:'todo'}));m.remove();save();toast('Imported '+l.length+' chapters');render()}}
function strat(p){const t=pend(p)[0];return`<div class="row sp"><h2>Saved strategies</h2><button class="btn s" onclick="newStrat()">+ Create Strategy</button></div>${p.strategies.map(s=>`<div class="card" style="margin-bottom:10px"><div class="row sp"><h3>🧠 ${esc(s.name)} ${s.active?'<span class="tag">Active</span>':''}</h3><div class="row"><button class="btn g s" onclick="stAct('${s.id}')">Set Active</button><button class="btn g s" onclick="stDup('${s.id}')">Duplicate</button><button class="btn g s" onclick="stEdit('${s.id}')">Edit</button><button class="btn r s" onclick="P().strategies=P().strategies.filter(x=>x.id!=='${s.id}');save();render()">Delete</button></div></div><p class="mut">${esc(s.obj)} · ${s.hours||3} h/day</p></div>`).join('')||'<p class="mut">No strategies yet.</p>'}
<div class="card"><h3>Study loop${t?' for '+esc(t.c.name):''}</h3><p>LEARN → PRACTICE → REVISE → TEST → ANALYZE</p><div class="blk"><b>20 min</b>Concept revision</div><div class="blk"><b>20 min</b>Formula + examples</div><div class="blk"><b>15 min</b>Problems</div><div class="blk"><b>5 min</b>Recall</div></div>`}
const newStrat=()=>form('Create strategy',[{k:'n',l:'Name',o:Object.keys(PRE)},{k:'o',l:'Objective (optional)'},{k:'h',l:'Daily study hours',t:'number',v:3}],v=>{P().strategies.push({id:uid(),name:v.n,obj:v.o||PRE[v.n],hours:+v.h,active:false});save();render()});
const stAct=id=>{P().strategies.forEach(s=>s.active=s.id===id);save();render()},stDup=id=>{const s={...P().strategies.find(x=>x.id===id),id:uid(),active:false};s.name+=' (copy)';P().strategies.push(s);save();render()},stEdit=id=>{const s=P().strategies.find(x=>x.id===id);form('Edit strategy',[{k:'n',l:'Name',v:s.name},{k:'o',l:'Objective',v:s.obj},{k:'h',l:'Hours/day',t:'number',v:s.hours}],v=>{Object.assign(s,{name:v.n,obj:v.o,hours:+v.h});save();render()})};
function rev(p){const r=[...p.revisions].sort((a,b)=>a.due.localeCompare(b.due));return`<div class="row sp"><h2>Revision planner</h2><button class="btn s" onclick="form('Custom revision',[{k:'l',l:'What to revise'},{k:'d',l:'Date',t:'date'}],v=>{if(v.l&&v.d){P().revisions.push({id:uid(),label:v.l,due:v.d,done:false});save();render()}})">+ Add custom</button></div><p class="mut">Completing a chapter auto-creates Day 1, 3, 7 and 14 revisions.</p><div class="card">${r.map(x=>`<div class="blk"><input type="checkbox" style="width:auto" aria-label="Done" ${x.done?'checked':''} onchange="revDone('${x.id}',this.checked)"><div style="flex:1;${x.done?'text-decoration:line-through;opacity:.6':''}">${esc(x.label)}<br><span class="mut">${x.due}</span></div><button class="btn g s" onclick="postp('${x.id}')">Postpone</button></div>`).join('')||'<span class="mut">Complete a chapter to generate revisions.</span>'}</div>`}
const revDone=(id,v)=>{const x=P().revisions.find(r=>r.id===id);x.done=v;if(v)award(10,'🔄 Revision done!');save();render()},postp=id=>{const x=P().revisions.find(r=>r.id===id);x.due=new Date(new Date(x.due).getTime()+864e5).toISOString().slice(0,10);save();render()};
function notes(p){return`<div class="row sp"><h2>Notes</h2><button class="btn s" onclick="form('New note',[{k:'s',l:'Subject',o:P().subjects.map(s=>s.name).concat(['General'])},{k:'t',l:'Title'},{k:'x',l:'Note',t:'area'}],v=>{P().notes.push({id:uid(),subj:v.s,title:v.t||'Untitled',text:v.x});save();render()})">+ Add note</button></div><div class="grid">${p.notes.map(n=>`<div class="card"><span class="tag">${esc(n.subj)}</span><h3>${esc(n.title)}</h3><p style="white-space:pre-wrap">${esc(n.text)}</p><button class="btn r s" onclick="P().notes=P().notes.filter(x=>x.id!=='${n.id}');save();render()">Delete</button></div>`).join('')||'<p class="mut">No notes for this plan.</p>'}</div>`}
const LOG={};
function asst(p){const l=LOG[p.id]||(LOG[p.id]=[{u:0,t:'Ask me about <b>'+esc(p.name)+'</b> — e.g. "How should I prepare?", "What is my weakest area?", "What next?"'}]);return`<div class="card"><div class="chat" id="chat">${l.map(m=>`<div class="m ${m.u?'u':'b'}">${m.u?esc(m.t):m.t}</div>`).join('')}</div><div class="row"><input id="q" placeholder="Ask about this plan…" style="flex:1" onkeydown="if(event.key==='Enter')ask()"><button class="btn" onclick="ask()">Send</button></div></div>`}
function ask(){const p=P(),q=$('#q').value.trim();if(!q)return;LOG[p.id].push({u:1,t:q});LOG[p.id].push({u:0,t:answer(p,q)});render();const c=$('#chat');c.scrollTop=1e9}
function answer(p,q){q=q.toLowerCase();const n=pend(p),d=Math.max(dl(p),0),top=n[0],wk=p.subjects.filter(s=>s.weak).map(s=>s.name);
// FUTURE AI API INTEGRATION: send plan context (subjects, progress, dates) to a server-side LLM here.
if(/weak|struggl/.test(q))return wk.length?'Weak areas in '+esc(p.name)+': <b>'+esc(wk.join(', '))+'</b>. Give them the first session each day.':'No subject is marked weak in this plan. Mark one in Syllabus to prioritise it.';
if(/next|today|what should/.test(q))return top?'Start with <b>'+esc(top.c.name)+'</b> ('+esc(top.subj)+', '+top.c.diff+'). Do one 45-minute block, then a 10-minute break.':'Everything is done — do revision and a mini test.';
if(/prepare|plan|strategy|how/.test(q))return d+' days and '+n.length+' chapters left ('+pct(p)+'% done). '+(n.length&&d?'That is about '+(n.length/d).toFixed(1)+' chapters per day. ':'')+'Start with '+(top?'<b>'+esc(top.c.name)+'</b>':'revision')+', then practise, and revise finished chapters on Day 1, 3, 7 and 14.';
return'In <b>'+esc(p.name)+'</b> you are '+pct(p)+'% done with '+d+' days left. Try asking what to study next or how to prepare.'}
function pset(p){return`<div class="card"><h3>Plan settings</h3><div class="row"><button class="btn g" onclick="form('Edit plan',[{k:'n',l:'Name',v:P().name},{k:'i',l:'Icon',v:P().icon},{k:'e',l:'Exam date',t:'date',v:P().exam},{k:'p',l:'Priority',o:['high','medium','low'],v:P().priority}],v=>{Object.assign(P(),{name:v.n||P().name,icon:v.i,exam:v.e||P().exam,priority:v.p});save();render()})">Rename / Edit</button><button class="btn g" onclick="dup()">Duplicate</button><button class="btn g" onclick="dl2('plan-'+P().name+'.json',P())">Export</button><button class="btn g" onclick="arch(P().id,true);go('plans')">Archive</button><button class="btn r" onclick="delPlan(P().id)">Delete</button></div></div>`}
// ---------- Behind mode, time-limited plan, focus ----------
function behind(){const p=P()||live()[0];if(!p)return toast('Create a plan first');const n=pend(p).slice(0,5),d=Math.max(dl(p),1);modal(`<h3>🚨 Emergency plan — ${esc(p.name)}</h3><p>${d} days, ${pend(p).length} chapters left. Don't try to complete everything at once. Focus on the highest-priority chapters first.</p>${n.map((x,i)=>`<div class="blk"><b style="min-width:30px">${i+1}.</b><div>${esc(x.c.name)}<br><span class="mut">${esc(x.subj)} · ${x.c.diff}/${x.c.imp}</span></div></div>`).join('')}<p class="mut">Study in 45-min blocks with breaks, sleep properly, and skip low-priority topics if time runs out. No all-nighters.</p><button class="btn" onclick="S.active='${p.id}';TMP=gen(P(),Math.min(S.hours+1,5)*60);S.tab='schedule';go('plan');document.querySelector('.modal').remove()">Generate this as a schedule</button>`)}
let FT=null;
function focus(){const p=P(),t=p&&pend(p)[0];form('Focus Mode',[{k:'m',l:'Minutes',o:['25','45','60','90'],v:'25'}],v=>{let s=+v.m*60,paused=false;const f=$('#focus');f.style.display='flex';const draw=()=>{f.innerHTML=`<div>FOCUS MODE</div><div>📚 ${t?esc(t.subj):'Study'}<br><span style="opacity:.7">${t?esc(t.c.name):''}</span></div><div class="t">${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}</div><div class="row" style="justify-content:center"><button class="btn g" onclick="FP()">${paused?'Resume':'Pause'}</button><button class="btn" onclick="FD(${+v.m})">Complete</button><button class="btn r" onclick="FE()">Exit</button></div>`};
window.FP=()=>{paused=!paused;draw()};window.FE=()=>{clearInterval(FT);f.style.display='none'};window.FD=m=>{FE();S.mins+=m;award(20,'🎉 Study session completed! Take a short break.');render()};draw();clearInterval(FT);FT=setInterval(()=>{if(paused)return;s--;if(s<=0){FD(+v.m)}else draw()},1000)})}
// ---------- Progress ----------
function progress(){const ps=live();return`<h1>Progress</h1><div class="grid"><div class="card">🔥 <span class="big">${S.streak}</span> day streak</div><div class="card">⭐ ${S.xp} XP · Level ${lvl()}<br><span class="mut">${ttl()}</span><div class="bar" style="margin-top:8px"><i style="width:${S.xp%100}%"></i></div></div><div class="card">⏱ ${S.mins} min focused</div></div>
<h2>Plans</h2>${ps.map(p=>`<div class="card" style="margin-bottom:10px"><div class="row sp"><b>${esc(p.icon+' '+p.name)}</b><span>${pct(p)}%</span></div><div class="bar" style="margin:8px 0"><i style="width:${pct(p)}%"></i></div>${p.subjects.map(s=>{const d=s.chapters.filter(c=>c.status==='done').length,t=s.chapters.length||1;return`<div class="row sp mut"><span>${esc(s.name)}</span><span>${Math.round(d/t*100)}%</span></div>`}).join('')}</div>`).join('')||'<p class="mut">No plans yet.</p>'}
<h2>Mood this week</h2><div class="card">${S.moods.filter(m=>Date.now()-m.d<6048e5).map(m=>`<span title="${new Date(m.d).toDateString()}" style="font-size:26px">${m.m}</span>`).join(' ')||'<span class="mut">No check-ins yet (stored only on this device).</span>'}</div>
<h2>Achievements</h2><div class="row">${[['🏅','First Study Session',S.mins>0],['🔥','7-Day Streak',S.streak>=7],['📚','First Chapter',ps.some(p=>pct(p)>0)],['🧠','Revision Master',ps.some(p=>p.revisions.filter(r=>r.done).length>=5)],['🎯','Exam Ready',ps.some(p=>pct(p)===100)]].map(a=>`<span class="tag" style="opacity:${a[2]?1:.4};padding:8px 12px">${a[0]} ${a[1]}</span>`).join('')}</div>`}
// ---------- Brain break ----------
const JOKES=['Teacher: Did you study?\nStudent: I opened the book. That\'s progress. 😂','Brain: We should study.\nAlso brain: Let\'s remember something embarrassing from 2017. 💀','My study plan is perfect. Following it is the hard part. 📚','I don\'t procrastinate. I do future me a favour by giving him more work. 😎','Exam tomorrow: suddenly my room needs cleaning. 🧹'];
const MOT=['Small steps still move you forward.','You don\'t need to do it all today — just the next thing.','Rest is part of studying.','Progress, not perfection.'];
function brk(){return`<h1>🧘 Brain Break</h1><div class="grid"><div class="card"><h3>😂 Student joke</h3><p id="jk" style="white-space:pre-wrap">${esc(JOKES[0])}</p><button class="btn s" onclick="$('#jk').textContent=JOKES[Math.floor(Math.random()*JOKES.length)]">Another one</button></div>
<div class="card"><h3>💭 Motivation</h3><p id="mo">${MOT[0]}</p><button class="btn s" onclick="$('#mo').textContent=MOT[Math.floor(Math.random()*MOT.length)]">New message</button></div><div class="card"><h3>🎲 Dice</h3><div class="big" id="dice">🎲</div><button class="btn s" onclick="$('#dice').textContent=['⚀','⚁','⚂','⚃','⚄','⚅'][Math.floor(Math.random()*6)]">Roll</button></div></div>
<h2>60-Second Reset</h2><div class="card" style="text-align:center"><div class="breath" id="br">Ready</div><button class="btn" onclick="reset60()">Start</button></div>
<h2>Mini games</h2><div class="grid"><div class="card"><h3>🧠 Memory Cards</h3><div class="mem" id="mem"></div><p class="mut" id="mm"></p><button class="btn s" onclick="initMem()">New game</button></div><div class="card"><h3>🎯 Reaction Test</h3><button class="btn" id="rt" style="width:100%;height:110px" onclick="react()">Click to start</button><p id="rr" class="mut"></p></div></div>`}
function initBreak(){initMem()}
let BT=null;function reset60(){let t=60;const b=$('#br');clearInterval(BT);const ph=()=>{const c=(60-t)%14;if(c<4){b.textContent='INHALE';b.style.transform='scale(1.4)'}else if(c<8){b.textContent='HOLD'}else{b.textContent='EXHALE';b.style.transform='scale(1)'}};ph();BT=setInterval(()=>{t--;if(!$('#br')){clearInterval(BT);return}if(t<=0){clearInterval(BT);b.textContent='Done 🌿';b.style.transform='scale(1)';toast('🌿 Nicely done');return}ph()},1000)}
let MC;function initMem(){const e=$('#mem');if(!e)return;const em=['📚','🧠','⚡','🎯'];MC={cards:[...em,...em].sort(()=>Math.random()-.5),open:[],found:0,moves:0,lock:false};e.innerHTML=MC.cards.map((c,i)=>`<button aria-label="Card ${i+1}" onclick="flip(${i},this)">❔</button>`).join('');$('#mm').textContent=''}
function flip(i,b){if(MC.lock||MC.open.some(o=>o[0]===i)||b.disabled)return;b.textContent=MC.cards[i];MC.open.push([i,b]);if(MC.open.length===2){MC.moves++;const[a,c]=MC.open;if(MC.cards[a[0]]===MC.cards[c[0]]){a[1].disabled=c[1].disabled=true;MC.open=[];if(++MC.found===4)$('#mm').textContent='🎉 Won in '+MC.moves+' moves!'}else{MC.lock=true;setTimeout(()=>{a[1].textContent=c[1].textContent='❔';MC.open=[];MC.lock=false},700)}}}
let RS=0,RTm;function react(){const b=$('#rt');if(RS===0){RS=1;b.textContent='Wait for green…';b.style.background='var(--bad)';RTm=setTimeout(()=>{RS=2;RS2=Date.now();b.textContent='CLICK!';b.style.background='var(--ok)'},1000+Math.random()*2500)}else if(RS===1){clearTimeout(RTm);RS=0;b.textContent='Too early! Try again';b.style.background=''}else{RS=0;$('#rr').textContent='⚡ '+(Date.now()-RS2)+' ms';b.textContent='Again';b.style.background=''}}let RS2=0;
// ---------- ChillBot ----------
const CL=[];
function chill(){return`<h1>🤖 ChillBot</h1><p class="mut">A friendly stress-relief companion — not a therapist or doctor.</p><div class="card"><div class="chat" id="cc"></div><div class="row">${[['😮‍💨 I\'m stressed','stressed'],['😴 I\'m tired','tired'],['😩 I don\'t feel like studying','lazy'],['😂 Make me laugh','joke'],['🧘 Help me relax','relax'],['📚 I\'m overwhelmed','overwhelmed']].map(b=>`<button class="btn g s" onclick="say('${b[1]}')">${b[0]}</button>`).join('')}</div><div class="row" style="margin-top:8px"><input id="ci" placeholder="Tell me what's going on…" style="flex:1" onkeydown="if(event.key==='Enter')say()"><button class="btn" onclick="say()">Send</button></div></div>`}
function initChill(){if(!CL.length)CL.push({u:0,t:'Hey! 👋 Rough study day? Tell me what\'s going on.'});drawC()}
function drawC(){const c=$('#cc');c.innerHTML=CL.map(m=>`<div class="m ${m.u?'u':'b'}">${m.t}</div>`).join('');c.scrollTop=1e9}
function say(k){const inp=$('#ci');const raw=k&&k.length<12?null:(inp.value||'').trim();const q=(raw||k||'').trim();if(!q)return;if(raw)CL.push({u:1,t:esc(raw)});inp.value='';CL.push({u:0,t:chillReply(q.toLowerCase())});drawC()}
function chillReply(q){const p=P(),ctx=p?'You\'ve got '+Math.max(dl(p),0)+' days and '+pend(p).length+' chapters left in <b>'+esc(p.name)+'</b>. ':'';const top=p&&pend(p)[0];
if(/suicid|kill myself|self.?harm|hurt myself|end my life|want to die|don'?t want to live/.test(q))return'I\'m really sorry you\'re feeling this much pain. I\'m only a small study app and can\'t help with this safely. Please reach out right now to a trusted adult or friend, or contact your local emergency number or a crisis helpline. You deserve real support, and you don\'t have to face this alone. 💙';
if(/joke|laugh/.test(q))return esc(JOKES[Math.floor(Math.random()*JOKES.length)]).replace(/\n/g,'<br>');
if(/relax|reset|breath/.test(q))return'Let\'s do a quick reset: breathe in for 4, hold for 4, out for 6. Try the <a href="#" onclick="go(\'break\');return false" style="color:var(--ac2)">60-second reset</a>. 🧘';
if(/lazy|motivat|feel like|don'?t feel/.test(q))return'That\'s okay. Let\'s make the first step tiny. Try just 10 minutes'+(top?' on <b>'+esc(top.c.name)+'</b>':'')+'. Pick one simple task and start there. 🚀';
if(/tired|sleep/.test(q))return'Sounds like your brain needs fuel. Drink water, stretch, or take a 15-minute break. Sleep beats an all-nighter every time. 😴';
if(/overwhelm|syllabus|too much/.test(q))return ctx+'Don\'t look at the whole mountain. '+(top?'Just do <b>'+esc(top.c.name)+'</b> first, then check the plan again.':'Pick one chapter and begin.')+' 📚';
if(/stress|anxious|worried|exam|scared/.test(q))return(ctx||'Yeah, that\'s a lot to keep in your head 😵‍💫. ')+'Let\'s take it one thing at a time'+(top?' — focus on <b>'+esc(top.c.name)+'</b> first.':'.')+' You don\'t have to solve everything right now. If it keeps feeling heavy, talk to a friend, parent or teacher.';
return'Thanks for sharing. Want a quick joke, a 60-second reset, or help picking your next small step? 💬'}
// ---------- Settings ----------
function settings(){return`<h1>Settings</h1><div class="grid"><div class="card"><h3>Student</h3><label>Name</label><input value="${esc((S.student||{}).name||'')}" onchange="S.student=S.student||{};S.student.name=this.value;save()"><label>Daily study hours</label><input type="number" min="1" max="8" value="${S.hours}" onchange="S.hours=+this.value||3;save()"><label>Preferred study start</label><input type="time" value="${S.pref}" onchange="S.pref=this.value;save()"><label>Theme</label><select onchange="S.theme=this.value;save();render()"><option value="">Auto</option><option ${S.theme==='light'?'selected':''}>light</option><option ${S.theme==='dark'?'selected':''}>dark</option></select></div>
<div class="card"><h3>Account</h3><p>Signed in as <b>${esc(USER)}</b></p><p class="mut">${CLOUD?'☁️ Also synced privately to your Claude account':'💾 Saved automatically on this device'}</p><button class="btn g" onclick="logout()">Log out</button></div><div class="card"><h3>Data backup</h3><div class="row"><button class="btn g" onclick="dl2('studymate-all.json',S)">Export All</button><button class="btn g" onclick="impAll()">Import All</button><button class="btn g" onclick="demo()">Load Demo Student</button><button class="btn r" onclick="confirmBox('Erase all data?',()=>{S=fresh();save();go('home')})">Reset All Data</button></div></div></div>`}
function impAll(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>i.files[0].text().then(t=>{try{const o=JSON.parse(t);if(o.plans)S=Object.assign(fresh(),o);else if(o.subjects){o.id=uid();S.plans.push(o);S.active=o.id}else throw 0;save();toast('Imported!');go('plans')}catch(e){toast('Invalid file')}});i.click()}
render();cloudInit();
</script>
</body>
</html>
